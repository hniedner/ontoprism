---
name: Update README Code Stats

on:
  push:
    branches: [main]

# Least privilege: default read-only; the commit-and-push job elevates to write.
permissions:
  contents: read

concurrency:
  group: update-readme-code-stats-main
  cancel-in-progress: true

jobs:
  update-readme:
    name: Update README line-count table
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit + push the regenerated README line-count table
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # This job commits + pushes the README update, so it keeps the persisted
          # token (explicit `true` is zizmor's endorsed artipacked remediation).
          persist-credentials: true
          ref: main
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Update README code stats
        run: python scripts/dev/update_readme_code_stats.py
      - name: Commit and push if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No README changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README code line-count table"
          git push origin HEAD:main

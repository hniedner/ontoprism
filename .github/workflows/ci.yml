name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # On-demand full CI for a feature branch that has no pull request yet. Without this,
  # `ci.yml` never runs during branch development, so defects batch up and are first
  # discovered when the PR opens. CI must be the last bar, not the discovery mechanism.
  workflow_dispatch:

concurrency:
  # Keyed by event as well as ref, so a dispatched branch run cannot cancel the pull
  # request's run on the same ref and leave a `cancelled` check that blocks the merge.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo (tests + coverage upload need no write
# scopes). Release/README workflows request their own write scopes explicitly.
permissions:
  contents: read

jobs:
  # Path filter so scoped PRs skip irrelevant job trees. Conservative: the heavy test
  # jobs also run unconditionally on push to main (post-merge full validation), and the
  # universal `quality` gate below is never skipped. Docker-build and the heavy pinned
  # model contract are path-gated even on push because their inputs are explicit.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
      embeddings: ${{ steps.filter.outputs.embeddings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'ontolib/**'
              - 'backend/**'
              - 'scripts/**'
              - 'test_support/**'
              - 'migrations/**'
              - 'data/**'
              - 'conftest.py'
              - 'alembic.ini'
              - 'pyproject.toml'
              - 'coverage-surfaces.toml'
              - 'pdm.lock'
              - '.pre-commit-config.yaml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'coverage-surfaces.toml'
              - 'scripts/validation/coverage_hierarchy.py'
              - 'scripts/validation/frontend_coverage_hierarchy.py'
              - 'scripts/validation/strict_coverage_gate.py'
              - '.github/workflows/ci.yml'
            embeddings:
              - 'ontolib/src/ontolib/repositories/embeddings/**'
              - 'backend/tests/test_embedding_model_contract.py'
              - 'pyproject.toml'
              - 'pdm.lock'
              - '.github/workflows/ci.yml'
            docker:
              # Image build inputs — catches bad FROM bumps / dependency-install breakage
              # that the test jobs can't (CI never builds the images otherwise).
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - 'docker-compose.yml'
              - 'pyproject.toml'
              - 'pdm.lock'
              - 'ontolib/pyproject.toml'
              - 'backend/pyproject.toml'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
              - '.github/workflows/ci.yml'

  # Static quality gates — runs the SAME pre-commit hooks developers run locally, so
  # CI is parity, not the place issues are first discovered. Always runs (pre-commit's
  # generic hooks cover every file, incl. docs), so it is intentionally not path-gated.
  quality:
    name: quality (pre-commit parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history so the fallow hook can resolve origin/main as its audit base.
          fetch-depth: 0

      - name: Set up PDM (cached)
        id: setup-pdm
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37  # v4.6
        with:
          python-version: "3.13"
          version: "2.28.0"
          cache: true

      - name: Restore pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-${{ runner.arch }}-pre-commit-${{ steps.setup-pdm.outputs.python-version }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps
        run: pdm sync --clean-unselected --dev

      - name: Install frontend deps (eslint/svelte-check hooks need node_modules)
        run: npm ci --prefix frontend

      - name: Run pre-commit (all files)
        run: pdm run pre-commit run --all-files --show-diff-on-failure

  backend-tests:
    name: backend tests
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PDM (cached)
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37  # v4.6
        with:
          python-version: "3.13"
          version: "2.28.0"
          cache: true

      - name: Install dependencies
        run: pdm sync --clean-unselected --dev

      - name: Run unit tests with coverage collection (no gate)
        # -n auto (xdist): the suite's stub HTTP servers require parallel workers;
        # pytest's serial global-capture teardown corrupts stdin fd (os.dup2 EBADF)
        # when run with -n 0, so we keep xdist. Coverage gate lives in coverage-verify.
        run: pdm run test-ci-no-gate

      - name: Bind unit coverage to this source tree
        env:
          COVERAGE_CONFIG_SET: python-combined
        run: |
          COVERAGE_VERSION="$(pdm run python -c 'import coverage; print(coverage.__version__)')"
          pdm run coverage-identity \
            --layer python-unit \
            --tool coverage.py \
            --tool-version "$COVERAGE_VERSION" \
            --output coverage-unit.identity.json

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-data
          # .coverage is a dotfile; upload-artifact@v4 excludes hidden files by default.
          include-hidden-files: true
          path: |
            .coverage
            coverage.xml
            coverage-unit.identity.json

  coverage-verify:
    name: coverage verify (ontolib + backend)
    needs: [backend-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # Only Coverage.py + the checked-out source are needed to gate and to render the
      # report-only hierarchy — no editable ontolib/backend install. relative_files=true
      # (pyproject) keeps the uploaded .coverage portable across jobs.
      - name: Install coverage
        run: pip install 'coverage>=7,<8'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-data
          path: coverage-unit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: coverage-integration-data
          path: coverage-integration

      - name: Combine same-commit coverage layers
        env:
          COVERAGE_CONFIG_SET: python-combined
        run: |
          python scripts/validation/coverage_hierarchy.py verify-identities \
            --against-current \
            coverage-unit/coverage-unit.identity.json \
            coverage-integration/coverage-integration.identity.json
          python -m coverage combine \
            coverage-unit/.coverage coverage-integration/.coverage.integration

      - name: Verify independent Python line and branch coverage > 90%
        run: >-
          python scripts/validation/strict_coverage_gate.py python
          --coverage-data .coverage
          --root .

      - name: Report native Python coverage hierarchy (non-blocking deficits)
        run: >-
          python scripts/validation/coverage_hierarchy.py python-report
          --coverage-data .coverage
          --identity coverage-unit/coverage-unit.identity.json
          --raw-output coverage-hierarchy/python-native.json
          --output coverage-hierarchy/python-hierarchy.json
          --text-output coverage-hierarchy/python-hierarchy.txt

      - name: Upload Python hierarchy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-hierarchy-python
          path: coverage-hierarchy/

  web-tests:
    name: web tests + coverage
    needs: [changes]
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up PDM (cached)
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37  # v4.6
        with:
          python-version: "3.13"
          version: "2.28.0"
          cache: true

      # `npm run test:coverage` chains `pdm run coverage-gate` (the gate must run on the
      # pinned project interpreter, not a bare `python3`), so this job needs the project
      # environment as well as Node.
      - name: Install dependencies
        run: pdm sync --clean-unselected --dev
        working-directory: ${{ github.workspace }}

      - name: Install
        run: npm ci

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Report native frontend coverage hierarchy (non-blocking deficits)
        run: pdm run python -m scripts.validation.frontend_coverage_hierarchy
        working-directory: ${{ github.workspace }}

      - name: Upload frontend hierarchy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-hierarchy-frontend
          path: |
            frontend/coverage/coverage-final.json
            frontend/coverage/hierarchy.json
            frontend/coverage/hierarchy.txt
          if-no-files-found: error

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npm run test:e2e

  # Behavioral integration tests against current-run-owned disposable resources.
  # Both Postgres and QLever are started as pinned, nonce-owned containers by the
  # test harness; application endpoints remain dead sentinels until a test opts in.
  integration-tests:
    name: integration tests (services)
    needs: [changes]
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://ontoprism_test_forbidden:forbidden@127.0.0.1:9/ontoprism_test_forbidden
      NCIT_SPARQL_URL: http://127.0.0.1:9
      UBERON_SPARQL_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PDM (cached)
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37  # v4.6
        with:
          python-version: "3.13"
          version: "2.28.0"
          cache: true

      - name: Install dependencies
        run: pdm sync --clean-unselected --dev

      # ROBOT + ELK (D28): without these on PATH the non-circular validation tests
      # (EL profile gate -> ELK classification -> promotion, #73) silently skip, and a
      # broken reasoner call looks exactly like "no candidate qualified".
      - name: Set up Java 21 (for ROBOT/ELK)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install ROBOT
        env:
          ONTOPRISM_ROBOT_DIR: ${{ runner.temp }}/ontoprism-robot
        run: |
          pdm run python scripts/install_robot.py --install-dir "$ONTOPRISM_ROBOT_DIR"
          echo "$ONTOPRISM_ROBOT_DIR" >> "$GITHUB_PATH"
          echo "ONTOPRISM_ROBOT_DIR=$ONTOPRISM_ROBOT_DIR" >> "$GITHUB_ENV"

      - name: Verify ROBOT
        run: robot --version

      - name: Install Apache Jena RIOT
        env:
          ONTOPRISM_JENA_DIR: ${{ runner.temp }}/ontoprism-jena
        run: |
          pdm run python scripts/install_jena.py --install-dir "$ONTOPRISM_JENA_DIR"
          echo "ONTOPRISM_JENA_DIR=$ONTOPRISM_JENA_DIR" >> "$GITHUB_ENV"

      - name: Verify Apache Jena RIOT
        run: |
          "$ONTOPRISM_JENA_DIR/bin/riot" --version

      - name: Integration tests (disposable resources)
        run: pdm run test-integration-ci-coverage

      - name: Bind integration coverage to this source tree
        env:
          COVERAGE_CONFIG_SET: python-combined
        run: |
          COVERAGE_VERSION="$(pdm run python -c 'import coverage; print(coverage.__version__)')"
          pdm run coverage-identity \
            --layer python-integration \
            --tool coverage.py \
            --tool-version "$COVERAGE_VERSION" \
            --output coverage-integration.identity.json

      - name: Upload integration coverage data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-integration-data
          include-hidden-files: true
          path: |
            .coverage.integration
            coverage-integration.identity.json

  embedding-model-contract:
    name: pinned embedding model contract
    needs: [changes]
    if: ${{ needs.changes.outputs.embeddings == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PDM (cached)
        uses: pdm-project/setup-pdm@544d7237314ee09c256785bd360f6b30add38b37  # v4.6
        with:
          python-version: "3.13"
          version: "2.28.0"
          cache: true

      - name: Install model contract dependencies
        run: pdm sync --clean-unselected --dev -G data-build

      - name: Verify pinned sentence-transformers contract
        run: pdm run pytest backend/tests/test_embedding_model_contract.py -v

  # Image smoke: build and start both runtime images when their inputs change, so base-image,
  # dependency-install, and runtime startup failures surface before deployment.
  docker-build:
    name: docker build smoke
    needs: [changes]
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build backend image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          load: true
          push: false
          tags: ontoprism-api:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          push: false
          tags: ontoprism-web:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Verify image runtimes
        run: |
          set -euo pipefail
          cleanup() {
            docker rm --force ontoprism-api-ci ontoprism-web-ci >/dev/null 2>&1 || true
            docker network rm ontoprism-ci >/dev/null 2>&1 || true
          }
          wait_for_command() {
            container="$1"
            shift
            for attempt in $(seq 1 30); do
              if docker exec "$container" "$@" >/dev/null 2>&1; then
                return 0
              fi
              sleep 1
            done
            docker logs "$container"
            return 1
          }
          trap cleanup EXIT
          docker network create ontoprism-ci >/dev/null
          docker run --detach --name ontoprism-api-ci --network ontoprism-ci ontoprism-api:ci
          docker run --detach --name ontoprism-web-ci --network ontoprism-ci \
            --env ORIGIN=http://127.0.0.1:3000 \
            --env ONTOPRISM_FASTAPI_ORIGIN=http://ontoprism-api-ci:8011 \
            ontoprism-web:ci
          wait_for_command ontoprism-api-ci python -c \
            "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=2).read()"
          wait_for_command ontoprism-web-ci node -e \
            "fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(2000)}).then(r => { if (!r.ok) throw new Error(String(r.status)) })"
          wait_for_command ontoprism-web-ci node -e \
            "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(2000)}).then(r => { if (r.status !== 404) throw new Error(String(r.status)) })"

  # Single aggregate status: fails if any job failed/was cancelled; treats skipped
  # (path-filtered) jobs as OK. Use this as the branch-protection required check.
  ci-summary:
    name: CI summary
    needs: [changes, quality, backend-tests, coverage-verify, web-tests, integration-tests, embedding-model-contract, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A CI job failed or was cancelled."
              exit 1
            fi
          done
          echo "All CI jobs passed or were skipped."

name: Release

# Fires after a successful push CI run on main, normally from a PR merge.
#
# Why `workflow_run` and not `pull_request: [closed]` or a bare `push`:
#   - `push` would release code whose CI has not finished (or has failed).
#   - `pull_request: closed` fires on the PR head, not the merge commit, so the
#     released tree would not be what actually landed on main.
#   - `workflow_run` on a successful CI run of a `push` to main means the pushed
#     tree is green after its required PR checks and post-merge push CI.
#
# Main's ruleset requires the PR checks. This workflow adds only a release tag and a
# GitHub release to the already-validated main commit; it never pushes a commit to main.

on:
  # Manual escape hatch. The automatic path below DEFERS whenever main has advanced
  # past the CI-validated commit with non-README changes, on the assumption that the
  # newer update's own CI run will release. Two updates landing within ~a minute of each
  # other can defeat that: the first defers to the second, and if the second's release
  # run does not fire, the release is simply lost — silently, with a green main. That
  # happened to v0.14.1 (the fix(search) relevance fix merged 40s before a docs PR).
  # Without this trigger there is no way to recover except pushing another commit, and
  # GitHub shows no "Run workflow" button at all.
  workflow_dispatch:

  # zizmor: ignore[dangerous-triggers] — workflow_run is used deliberately and
  # safely here: the guard step below requires the CI-validated commit or a successor
  # that differs only in README.md; manual dispatch relies on an operator check. The
  # job never checks out untrusted PR code.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: semantic release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # push the tag and create the GitHub release
      id-token: write   # OIDC, required by python-semantic-release
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          fetch-depth: 0          # full history + tags: semantic-release needs both
          persist-credentials: true

      - name: Evaluate release eligibility
        id: guard
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          if [ -z "${VALIDATED_SHA:-}" ]; then
            # Manual dispatch: there is no workflow_run to validate against, so the
            # operator is asserting that main's tip is good. That is the point of the
            # hatch — it exists precisely for the case where the automatic path lost a
            # release — but it does mean the CI-validated-tip invariant is asserted by a
            # human here rather than enforced by the workflow. Check main is green first.
            echo "Manual dispatch: releasing main's tip ($head)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$head" != "$VALIDATED_SHA" ]; then
            echo "main advanced past $VALIDATED_SHA; deferring to that update's own CI run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Semantic release
        id: release
        if: steps.guard.outputs.skip == 'false'
        uses: python-semantic-release/python-semantic-release@9a026e9303981c866c3425723009becb2437c757  # v10.6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          commit: false
          tag: true
          push: true
          changelog: false
          vcs_release: true
          build: false

      - name: Summary
        if: always()
        env:
          SKIPPED: ${{ steps.guard.outputs.skip }}
          RELEASED: ${{ steps.release.outputs.released }}
          TAG: ${{ steps.release.outputs.tag }}
          LINK: ${{ steps.release.outputs.link }}
        run: |
          {
            echo "## Release"
            echo
            if [ "$SKIPPED" = "true" ]; then
              echo "Skipped — main advanced past the validated commit; that update's own CI run will release it."
            elif [ "$RELEASED" = "true" ]; then
              echo "Released **$TAG** — $LINK"
            else
              echo "No release: no \`feat\`/\`fix\`/breaking commits since the last tag."
              echo
              echo "Version bumps come from Conventional Commit subjects. \`docs\`, \`chore\`,"
              echo "\`test\`, \`ci\`, \`refactor\` and \`style\` are changelog-only and never bump."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

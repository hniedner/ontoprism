schema_version = 1
report_only = true
limitations = [
  "Coverage.py 7.15 native function/class regions are authoritative for Python ownership; zero-branch scopes are rendered as N/A instead of Coverage.py's synthetic 100%.",
  "Vitest's native Istanbul map is authoritative for frontend module denominators. Production-bundle Playwright maps attribute to original Svelte sources but cannot be merged with Vitest without duplicate regions, so browser coverage is behavioral evidence only.",
  "Executable production surfaces absent from their trusted measurement layer report 0% unmeasured. YAML, shell, browser-only routes, and excluded rendering shells are never silently omitted.",
  "The hierarchy is report-only in #170. Strict independent line and branch aggregate gates for ontolib/src, backend/src, and frontend/src/lib remain the only blocking coverage gates until #169.",
]
required_production_paths = [
  "ontolib/src/ontolib/decomposition/stated_queries.py",
  "ontolib/src/ontolib/repositories/xref/cadsr_anchors.py",
  "ontolib/src/ontolib/repositories/xref/candidate_ingest.py",
  "ontolib/src/ontolib/repositories/xref/coverage.py",
  "ontolib/src/ontolib/repositories/xref/promotion.py",
  "ontolib/src/ontolib/repositories/xref/store.py",
  "backend/src/backend/main.py",
  "frontend/src/app.html",
  "frontend/src/routes/+layout.svelte",
  "frontend/src/routes/+page.svelte",
  "frontend/src/routes/refresh/+page.svelte",
  "frontend/src/routes/refresh/+page.ts",
  "frontend/src/routes/repositories/cadsr/+layout.ts",
  "frontend/src/routes/repositories/cadsr/+page.svelte",
  "frontend/src/routes/repositories/cadsr/[id]/+page.svelte",
  "frontend/src/routes/repositories/clinicaltrials/+layout.ts",
  "frontend/src/routes/repositories/clinicaltrials/+page.svelte",
  "frontend/src/routes/repositories/clinicaltrials/[nct]/+page.svelte",
  "frontend/src/routes/repositories/ncit/+layout.ts",
  "frontend/src/routes/repositories/ncit/+page.svelte",
  "frontend/src/routes/repositories/ncit/[code]/+page.svelte",
  "frontend/src/routes/repositories/pubmed/+layout.ts",
  "frontend/src/routes/repositories/pubmed/+page.svelte",
  "frontend/src/routes/repositories/pubmed/[pmid]/+page.svelte",
  "frontend/src/lib/components/ExternalMappingsPanel.svelte",
  "frontend/src/lib/components/GraphExplorer.svelte",
  "frontend/src/lib/components/GraphMinimap.svelte",
  "frontend/src/lib/components/GraphSidePanel.svelte",
  "frontend/src/lib/components/NeighborhoodGraph.svelte",
  "frontend/src/lib/components/RepoBrowsePage.svelte",
  "frontend/src/lib/components/RepoPageHeader.svelte",
  "frontend/src/lib/components/pubmed/PubMedArticleHeader.svelte",
  "frontend/src/lib/components/trial/TrialOutcomes.svelte",
  "scripts/data_build.py",
  "scripts/decompose.py",

[[exemption]]
path = "ontolib/src/ontolib/common/error_handling.py"
line = 47
kind = "pragma-no-cover"
owner = "ontolib maintainers"
rationale = "max_attempts is validated as positive and every loop path returns or raises, so this defensive assertion is structurally unreachable."
behavioral_test = "ontolib/tests/terminologies/test_retry_backoff.py"
review_issue = 169
review_after = "2027-01-25"

[[exemption]]
path = "if TYPE_CHECKING:"
line = 1
kind = "coverage-exclude-regex"
owner = "Python maintainers"
rationale = "TYPE_CHECKING blocks are static typing imports and do not execute in production."
behavioral_test = "backend/tests/test_coverage_hierarchy.py"
review_issue = 169
review_after = "2027-01-25"
configured_in = "pyproject.toml"

[[exemption]]
path = "raise NotImplementedError"
line = 1
kind = "coverage-exclude-regex"
owner = "Python maintainers"
rationale = "Abstract-interface sentinel branches are not executable implementation behavior; the manifest validator detects drift in this exclusion."
behavioral_test = "backend/tests/test_coverage_hierarchy.py"
review_issue = 169
review_after = "2027-01-25"
configured_in = "pyproject.toml"


# OntoPrism data services. Immutable ontology indexes are served by bounded QLever
# processes; mutable curation and application state live in PostgreSQL.
services:
  qlever-ncit:
    image: docker.io/adfreiburg/qlever@sha256:abeb20ae245184cee2991a99c22a9bb0a62f6884bb1a03747bf7e56165cb0ca6
    container_name: ontoprism-qlever-ncit
    working_dir: /data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec qlever-server -i ncit -p 7001 --no-access-check
        --persist-updates --service-allowed-iri-prefixes -
        -j 2 -m 8G -c 1G -e 512M -s 30s
    ports:
      - "127.0.0.1:7888:7001"
    volumes:
      - ./data/qlever-ncit:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -G --data-urlencode 'query=ASK {}'
          -H 'Accept: application/sparql-results+json'
          http://127.0.0.1:7001/ >/dev/null
      interval: 10s
      timeout: 5s
      retries: 10

  qlever-uberon:
    image: docker.io/adfreiburg/qlever@sha256:abeb20ae245184cee2991a99c22a9bb0a62f6884bb1a03747bf7e56165cb0ca6
    container_name: ontoprism-qlever-uberon
    working_dir: /data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        exec qlever-server -i uberon -p 7001 --no-access-check
        --service-allowed-iri-prefixes -
        -j 2 -m 2G -c 256M -e 256M -s 30s
    ports:
      - "127.0.0.1:7889:7001"
    volumes:
      - ./data/qlever-uberon:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS -G --data-urlencode 'query=ASK {}'
          -H 'Accept: application/sparql-results+json'
          http://127.0.0.1:7001/ >/dev/null
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector@sha256:7f5681e45237acdf546cf7cdc0dfc0ed7752ede857fda6e54f6ea21b936f8742
    container_name: ontoprism-postgres
    environment:
      POSTGRES_USER: ontoprism
      POSTGRES_PASSWORD: ontoprism
      POSTGRES_DB: ontoprism
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ontoprism_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontoprism"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ontoprism_pg_data:

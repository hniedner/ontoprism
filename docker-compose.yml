# ONTOPRISM's own data services. Every image is an immutable upstream digest, so a
# fresh checkout needs neither a sibling repository nor a locally built base image.
#
#   ontoprism            fairdata (do not touch)
#   ---------            ----------------------
#   oxigraph-ncit  7888    fairdata-oxigraph         7878
#   oxigraph-uberon 7889   fairdata-oxigraph-uberon  7879
#   postgres       5433    fairdata-postgres         5432
#   backend        8011    (fairdata backend)        8001
#
# The two Oxigraph services use the same official 0.5.3 image as the offline loader in
# `sibling_store.py`; that exact identity is persisted in each candidate manifest.
services:
  oxigraph-ncit:
    image: ghcr.io/oxigraph/oxigraph@sha256:cc943499d4724fbb348c75c623335c69a047de71c59852413b0d0467d3caebe3
    container_name: ontoprism-oxigraph-ncit
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]
    ports:
      - "127.0.0.1:7888:7878"
    volumes:
      - ./data/oxigraph-ncit:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/oxigraph", "query", "--location", "/data", "--query", "ASK {}", "--results-format", "json"]
      interval: 10s
      timeout: 5s
      retries: 10

  oxigraph-uberon:
    image: ghcr.io/oxigraph/oxigraph@sha256:cc943499d4724fbb348c75c623335c69a047de71c59852413b0d0467d3caebe3
    container_name: ontoprism-oxigraph-uberon
    command: ["serve", "--location", "/data", "--bind", "0.0.0.0:7878"]
    ports:
      - "127.0.0.1:7889:7878"
    volumes:
      - ./data/oxigraph-uberon:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/oxigraph", "query", "--location", "/data", "--query", "ASK {}", "--results-format", "json"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: pgvector/pgvector@sha256:7f5681e45237acdf546cf7cdc0dfc0ed7752ede857fda6e54f6ea21b936f8742
    container_name: ontoprism-postgres
    environment:
      POSTGRES_USER: ontoprism
      POSTGRES_PASSWORD: ontoprism
      POSTGRES_DB: ontoprism
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ontoprism_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontoprism"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ontoprism_pg_data:

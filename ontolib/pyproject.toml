[project]
name = "ontolib"
dynamic = ["version"]
description = "Ontology/terminology core (storage, terminologies, cadsr) for ontoprism."
requires-python = ">=3.14,<3.15"
# Runtime deps are declared centrally in the root project; this package stays light.
dependencies = []

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm.build]
package-dir = "src"

[tool.pdm.version]
source = "scm"
